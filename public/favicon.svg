<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72ddfd" />
      <stop offset="50%" stop-color="#3aadcc" />
      <stop offset="100%" stop-color="#008cb3" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06151e" />
      <stop offset="100%" stop-color="#031018" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#3aadcc" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle Wave Glow Background -->
  <path d="M8 46 Q 20 40, 32 46 T 56 46" fill="none" stroke="#72ddfd" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M8 52 Q 20 48, 32 52 T 56 52" fill="none" stroke="#72ddfd" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Stylized Trout Icon -->
  <g filter="url(#neonGlow)">
    <!-- Trout Body -->
    <path 
      d="M12 32 C 16 20, 36 18, 48 24 C 54 27, 56 31, 56 32 C 56 33, 54 37, 48 40 C 36 46, 16 44, 12 32 Z" 
      fill="url(#glowGrad)" 
    />
    <!-- Tail Fin -->
    <path 
      d="M14 32 L 6 22 C 8 28, 8 36, 6 42 Z" 
      fill="#72ddfd" 
    />
    <!-- Dorsal Fin -->
    <path 
      d="M28 20 C 32 15, 38 16, 42 19 C 37 19, 32 20, 28 20 Z" 
      fill="#72ddfd" 
    />
    <!-- Ventral / Pectoral Fin -->
    <path 
      d="M30 44 C 34 49, 40 48, 42 45 C 37 45, 33 44, 30 44 Z" 
      fill="#3aadcc" 
    />
    <!-- Trout Eye -->
    <circle cx="48" cy="30" r="2" fill="#031018" />
    <circle cx="48.5" cy="29.5" r="0.7" fill="#ffffff" />

    <!-- Streamline Curve Detail -->
    <path 
      d="M20 32 Q 32 30, 44 33" 
      fill="none" 
      stroke="#031018" 
      stroke-width="1.5" 
      stroke-linecap="round"
      opacity="0.6"
    />
  </g>
</svg>
